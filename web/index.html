<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roberto</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#101b22;color:#edf4f3}*{box-sizing:border-box}body{margin:0}main{max-width:880px;margin:auto;padding:24px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:27px;margin:0}p{line-height:1.5}.muted,small{color:#a9bec5}button,input,select{font:inherit}button{cursor:pointer;background:#28474e;border:1px solid #42616a;color:#edf4f3;border-radius:9px;padding:11px 15px}button:hover{border-color:#8de0ba}button:disabled{opacity:.5;cursor:wait}.secondary{background:transparent}#status{margin:20px 0 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}#state{flex:1;min-width:180px;color:#8de0ba}meter{width:90px;height:12px}.chat{height:46vh;min-height:240px;max-height:540px;overflow:auto;background:#162730;border:1px solid #31444e;border-radius:12px;padding:18px;margin:20px 0 14px}.message{padding:12px 14px;border-radius:10px;background:#243e48;margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{background:#305745;margin-left:12%}.message.error{background:#4a302f;border:1px solid #b77966}.message small{display:block;font-size:11px;letter-spacing:.08em;margin-bottom:5px;color:#a5e2c8}.entry{display:flex;gap:8px}input{flex:1;min-width:0;background:#10232c;color:#edf4f3;border:1px solid #42616a;border-radius:9px;padding:12px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}.usb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px;color:#a9bec5;font-size:14px}#usb{flex:1}details{margin-top:14px;color:#a9bec5}summary{cursor:pointer}select{max-width:100%;background:#162730;color:#edf4f3;padding:8px;border:1px solid #42616a;border-radius:6px}.connection{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}footer{margin-top:25px;border-top:1px solid #31444e;padding-top:15px;display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:13px}@media(max-width:550px){.controls{grid-template-columns:1fr 1fr}main{padding:18px 12px}.chat{height:42vh}.entry button{padding:10px}header small{display:none}}
</style></head><body><main>
<header><h1>Roberto</h1><small>Converse comigo</small></header>
<div id="status"><span id="state" role="status">Conectando ao Roberto…</span><meter id="level" min="0" max="1" value="0" aria-label="Nível do microfone"></meter><button id="mic" class="secondary" type="button">Pausar microfone</button></div>
<small id="health">Preparando voz e reconhecimento…</small>
<div id="chat" class="chat" role="log" aria-label="Conversa"><p id="intro" class="muted">Diga “Roberto” e sua pergunta, ou escreva abaixo. Eu respondo por texto e voz.</p></div>
<form id="entry" class="entry"><input id="message" maxlength="1200" autocomplete="off" aria-label="Pergunta ou comando" placeholder="Escreva uma pergunta ou pedido…"><button id="send" type="submit">Enviar</button></form>
<div class="controls" aria-label="Controles do Arduino"><button type="button" data-action="ARM_UP">Levantar braço</button><button type="button" data-action="ARM_DOWN">Abaixar braço</button><button type="button" data-action="LED_ON">Acender luz</button><button type="button" data-action="LED_OFF">Apagar luz</button></div>
<div class="usb"><span id="usb">Procurando Arduino…</span><span>Servo D9 · LED D6</span></div>
<details><summary>Conexão USB</summary><div class="connection"><select id="ports" aria-label="Porta do Arduino"></select><button id="refresh" type="button">Atualizar portas</button><button id="connect" type="button">Conectar Arduino</button></div></details>
<footer><span>Espere a fala terminar para fazer outro pedido por voz.</span><button id="shutdown" class="secondary" type="button">Encerrar</button></footer>
</main><script>
const $=id=>document.getElementById(id);let seq=0,session='',state=null,stopped=false;
function message(text,kind='assistant'){const intro=$('intro');if(intro)intro.remove();const el=document.createElement('div');el.className='message '+kind;const label=document.createElement('small');label.textContent=kind==='user'?'VOCÊ':kind==='error'?'AVISO':'ROBERTO';el.append(label,document.createTextNode(text));$('chat').append(el);while($('chat').children.length>60)$('chat').firstChild.remove();$('chat').scrollTop=$('chat').scrollHeight}
async function request(url,body){const r=await fetch(url,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(6000),cache:'no-store'});let data;try{data=await r.json()}catch{throw new Error('O painel não respondeu. Confira se o Roberto está iniciado.')}if(!r.ok)throw new Error(typeof data.detail==='string'?data.detail:'Não foi possível concluir o pedido.');return data}
async function refresh(){const ps=await request('/api/ports');$('ports').replaceChildren();for(const p of ps){const option=document.createElement('option');option.value=p.port;option.textContent=p.port+' — '+p.name;$('ports').append(option)}if(state&&state.port&&ps.some(p=>p.port===state.port))$('ports').value=state.port}
$('entry').onsubmit=async e=>{e.preventDefault();const text=$('message').value.trim();if(!text)return;try{await request('/api/utterance',{text});$('message').value=''}catch(e){message(e.message,'error')}};
$('mic').onclick=async()=>{try{await request('/api/microphone',{enabled:!state?.mic})}catch(e){message(e.message,'error')}};
for(const b of document.querySelectorAll('[data-action]'))b.onclick=async()=>{b.disabled=true;try{await request('/api/action',{action:b.dataset.action})}catch(e){message(e.message,'error')}finally{b.disabled=false}};
$('refresh').onclick=()=>refresh().catch(e=>message(e.message,'error'));
$('connect').onclick=async()=>{const port=$('ports').value;if(!port){message('Conecte o Arduino e atualize as portas.','error');return}try{$('connect').disabled=true;await request('/api/serial',{port})}catch(e){message(e.message,'error')}finally{$('connect').disabled=false}};
$('shutdown').onclick=async()=>{try{await request('/api/shutdown',{});stopped=true;$('state').textContent='Roberto encerrado';$('health').textContent='Para iniciar, abra INICIAR_ROBERTO.bat.'}catch(e){message(e.message,'error')}};
async function poll(){if(stopped)return;try{let s=await request('/api/state?after='+seq);if(session&&s.session!==session){seq=0;$('chat').replaceChildren();s=await request('/api/state?after=0')}session=s.session;state=s;$('state').textContent=s.state;$('mic').textContent=s.mic?'Pausar microfone':'Ativar microfone';$('level').value=s.mic?s.level:0;$('send').disabled=s.busy;$('health').textContent='Microfone: '+s.health.microfone+' · Voz: '+s.health.voz+' · IA: '+s.health.ia;$('usb').textContent=s.connected?'Arduino conectado — '+s.port:s.health.arduino;for(const b of document.querySelectorAll('[data-action]'))b.disabled=s.action_busy;for(const e of s.events){seq=Math.max(seq,e.seq);if(['user','assistant','error'].includes(e.type))message(e.data,e.type)}}catch(e){$('state').textContent='Sem conexão com o Roberto';$('health').textContent='Confira se INICIAR_ROBERTO.bat está aberto.'}finally{if(!stopped)setTimeout(poll,700)}}
refresh().catch(()=>{});poll();
</script></body></html>
